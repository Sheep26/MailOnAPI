volumes:
  db:

services:
  mailonapi:
    image: mailonapi:latest
    container_name: mailonapi
    restart: always
    depends_on:
      - mailonapi-db
    ports:
      - "8080:8080"
      - "143:143"
      - "993:993"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./config:/config
    environment:
      CONFIG_PATH: /config/config.json

  mailonapi-db:
    image: mysql:9.6.0
    container_name: mailonapi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: YOUR_PASSWORD
    volumes:
      - type: volume
        source: db
        target: /var/lib/mysql