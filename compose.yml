services:
  mailonapi:
    image: mailonapi:latest
    container_name: mailonapi
    restart: always
    depends_on:
      mailonapi-db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "143:143"
      - "993:993"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /config:/config
    environment:
      CONFIG_PATH: /config/config.json

  mailonapi-db:
    image: mysql:9.6.0
    container_name: mailonapi-db
    restart: unless-stopped
    command: --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: YOUR_PASSWORD
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - type: volume
        source: /var/lib/mysql
        target: /var/lib/mysql